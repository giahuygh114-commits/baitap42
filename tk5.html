<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TK5: Accordion đơn giản</title><link rel="stylesheet" href="style.css"><style>.h{width:100%;text-align:left;border-radius:0}.c{max-height:0;overflow:hidden;background:#fff;padding:0 16px;transition:max-height .3s ease,padding .3s ease}.c.open{max-height:200px;padding:12px 16px}@media(prefers-reduced-motion:reduce){.c{transition:none}}</style></head><body><nav><a href="42.html">Trang chủ</a><a href="tk5.html">TK5</a><a href="tk7.html">TK7</a><a href="tk8.html">TK8</a><a href="k4.html">K4</a><a href="k6.html">K6</a><a href="k8.html">K8</a></nav><main><h1>TK5: Accordion đơn giản</h1><p>Bấm vào tiêu đề để mở hoặc đóng nội dung.</p>
<button class="h" id="h">Tiêu đề (bấm để mở/đóng)</button>
<div class="c" id="c"><p>Đây là nội dung ẩn. Nội dung trượt xuống hoặc trượt lên nhờ max-height và transition.</p></div>
<script>
document.getElementById("h").addEventListener("click",function(){document.getElementById("c").classList.toggle("open")});
</script>
</main></body></html>
